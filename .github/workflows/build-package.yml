name: Build single package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory to compile
        required: true
        default: package/firmware/linux-firmware

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autopoint bison build-essential bzip2 ccache clang \
            cmake cpio curl device-tree-compiler flex gawk gettext git g++ \
            gperf intltool libelf-dev libncurses-dev libssl-dev libtool \
            libyaml-dev patch pkgconf python3 python3-pyelftools rsync \
            squashfs-tools scons subversion swig unzip wget xmlto zlib1g-dev zstd

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp configs/an7581-nokia_xg-040g-md-ubi.config .config
          make defconfig
          # the package has to be selected for its Makefile to be built
          grep -q '^CONFIG_PACKAGE_airoha-en8811h-firmware=' .config || \
            echo 'CONFIG_PACKAGE_airoha-en8811h-firmware=m' >> .config
          make defconfig

      - name: Build tools
        run: make tools/install -j"$(nproc)"

      - name: Build package
        run: make ${{ inputs.package }}/compile V=s -j"$(nproc)"

      - name: Collect apk
        run: |
          mkdir -p out
          find bin/packages -name '*.apk' -exec cp -v {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: out/*.apk
          if-no-files-found: error
